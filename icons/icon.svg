<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- SVG Definitions for Gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGradient)"/>

  <!-- Document/Paper Shape -->
  <rect x="140" y="100" width="232" height="312" rx="16" fill="white" opacity="0.95"/>

  <!-- Document Text Lines -->
  <rect x="180" y="150" width="152" height="12" rx="4" fill="#3b82f6" opacity="0.6"/>
  <rect x="180" y="180" width="152" height="12" rx="4" fill="#3b82f6" opacity="0.6"/>
  <rect x="180" y="210" width="120" height="12" rx="4" fill="#3b82f6" opacity="0.6"/>

  <!-- Bar Chart (representing training data visualization) -->
  <rect x="180" y="260" width="24" height="80" rx="4" fill="#22c55e"/>
  <rect x="220" y="300" width="24" height="40" rx="4" fill="#f59e0b"/>
  <rect x="260" y="280" width="24" height="60" rx="4" fill="#ef4444"/>
  <rect x="300" y="240" width="24" height="100" rx="4" fill="#3b82f6"/>

  <!-- Checkmark Badge (bottom right - represents compliance/completion) -->
  <circle cx="380" cy="380" r="50" fill="#22c55e"/>
  <path d="M 360 380 L 375 395 L 400 365" stroke="white" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
